services:
  catalogo-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8227:3000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:3001
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - UNSPLASH_API_KEY=${UNSPLASH_API_KEY}
    networks:
      - rede-cutelaria
    restart: always

  auth-service:
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - FRONTEND_URL=${FRONTEND_URL}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=minioadmin
    networks:
      - rede-cutelaria
    restart: always

  redis:
    image: redis:alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - rede-cutelaria
    restart: always

  log-service:
    build:
      context: ./LogService
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - rede-cutelaria
    restart: always

  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    networks:
      - rede-cutelaria
    restart: always

networks:
  rede-cutelaria:
    driver: bridge
volumes:
  redis-data:
  minio-data:
